<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Faltao Hub - Générateur de Clé</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding-top: 50px; }
        .box { background: #1e1e1e; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        input { padding: 10px; width: 300px; font-size: 16px; text-align: center; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 5px; margin-top: 10px; }
        button { padding: 10px 20px; font-size: 16px; background: #7b2cbf; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 15px; }
        button:hover { background: #9d4edd; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🔑 Votre Clé Faltao Hub</h2>
        <p>Voici votre clé générée (Valide 24 heures) :</p>
        <input type="text" id="keyOutput" readonly value="Génération en cours...">
        <br>
        <button onclick="copyKey()">Copier la clé</button>
    </div>

    <script>
        const SUPABASE_URL = "https://cfpmnlbnccljosncrjca.supabase.co"; // Ex: https://xxxxx.supabase.co
        const SUPABASE_KEY = "sb_publishable_t0w0igSVmZcByq5ZhepVsw_C_qO249q"; // Celle qui commence par sb_publishable_...

        function generateRandomKey() {
            return 'faltao_' + Math.random().toString(36).substring(2) + Math.random().toString(36).substring(2);
        }

        async function createAndSaveKey() {
            const keyInput = document.getElementById("keyOutput");
            const newKey = generateRandomKey();
            const expiresAt = new Date(new Date().getTime() + 24 * 60 * 60 * 1000).toISOString();

            try {
                let response = await fetch(`${SUPABASE_URL}/rest/v1/keys`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify({
                        key_code: newKey,
                        expires_at: expiresAt
                    })
                });

                if (response.ok) {
                    keyInput.value = newKey;
                } else {
                    keyInput.value = "Erreur de génération !";
                }
            } catch (err) {
                keyInput.value = "Erreur de connexion.";
            }
        }

        function copyKey() {
            const copyText = document.getElementById("keyOutput");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert("Clé copiée ! Tu peux la coller dans le jeu.");
        }

        createAndSaveKey();
    </script>
</body>
</html>
