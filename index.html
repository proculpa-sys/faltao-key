<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faltao Hub - Vérification</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f1115;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .success-card {
            background-color: #181b22;
            border: 1px solid #232733;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h2 {
            color: #2ecc71;
            font-size: 24px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        p {
            color: #a0a5b2;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .highlight {
            color: #ffffff;
            font-weight: 600;
        }

        .discord-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #5865F2;
            color: #ffffff;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(88, 101, 242, 0.3);
            margin-top: 20px;
        }

        .discord-btn:hover {
            background-color: #4752C4;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="success-card">
        <h2>✅ Vérification Réussie !</h2>
        <p>Ton accès a été validé avec succès.</p>
        
        <p>
            <span class="highlight">Dernière étape :</span> Retourne sur le serveur Discord, va dans le salon dédié et utilise les boutons du bot pour récupérer ta clé, voir ton HWID ou demander un reset.
        </p>

        <!-- Bouton pour rejoindre le Discord -->
        <a href="https://discord.gg/mPfryNY5vA" target="_blank" class="discord-btn">
            Rejoindre le Discord 🚀
        </a>
    </div>

</body>
</html>
