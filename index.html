<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Faltao Hub - Vérification Linkvertise</title>
    <style>
        body { background-color: #121212; color: white; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #1e1e1e; padding: 35px; border-radius: 12px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.6); width: 400px; }
        h2 { color: #9b59b6; margin-bottom: 15px; }
        p { color: #ccc; font-size: 14px; line-height: 1.5; margin-bottom: 25px; }
        .btn { background: #5865F2; color: white; border: none; padding: 14px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; text-decoration: none; display: inline-block; box-sizing: border-box; font-size: 15px; transition: background 0.2s; }
        .btn:hover { background: #4752C4; }
    </style>
</head>
<body>
    <div class="box" id="contentBox">
        <h2>⚡ Faltao Hub — Vérification</h2>
        <p>Merci d'avoir passé le lien Linkvertise ! Connecte-toi avec ton compte Discord pour valider ton accès et débloquer ta clé sur le serveur.</p>
        
        <!-- Bouton de connexion Discord OAuth2 -->
        <a id="discordBtn" href="#" class="btn">🔗 Se connecter avec Discord</a>
    </div>

    <script>
        const CLIENT_ID = "1541444851961172100"; // Ton Client ID
        const REDIRECT_URI = "https://proculpa-sys.github.io/faltao-key/"; // Ton URL GitHub Pages

        // Génère le lien d'autorisation avec l'option guilds.join pour l'ajouter au serveur et lui donner le rôle
        const authUrl = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify%20guilds.join`;
        document.getElementById("discordBtn").href = authUrl;

        // Vérifie si Discord vient de rediriger l'utilisateur après l'autorisation
        const fragment = new URLSearchParams(window.location.hash.slice(1));
        const accessToken = fragment.get("access_token");

        if (accessToken) {
            // L'utilisateur vient de valider ! On change l'affichage de la page
            document.getElementById("contentBox").innerHTML = `
                <h2 style="color: #2ecc71;">✅ Vérification Réussie !</h2>
                <p>Ton accès a été validé avec succès.<br><br><b>Dernière étape :</b> Retourne sur le serveur Discord, va dans le salon des clés et clique sur <b>Clé du Jour</b> pour récupérer ta clé !</p>
            `;
        }
    </script>
</body>
</html>
